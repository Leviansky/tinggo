version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kanggo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: task_management
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Ini akan otomatis menjalankan schema.sql saat database pertama kali dibuat
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
